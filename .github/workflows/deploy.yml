name: Despliegue de Astro a GitHub Pages (pnpm)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Habilitar Corepack
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar Dependencias con pnpm
        run: pnpm install --frozen-lockfile

      - name: Verificar formato
        run: pnpm format:check

      - name: Verificar tipos y componentes Astro
        run: pnpm check

      - name: Ejecutar pruebas unitarias
        run: pnpm test

      - name: Construir el Sitio de Astro
        run: pnpm run build

      - name: Instalar Chromium para las pruebas E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: pnpm test:e2e

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir Artefacto de Producción
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
